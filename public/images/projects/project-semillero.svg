<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="semBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#721B24"/>
      <stop offset="60%" stop-color="#CA6702"/>
      <stop offset="100%" stop-color="#EE9B00"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#semBg)"/>
  <circle cx="450" cy="150" r="180" fill="#FDE047" opacity="0.25"/>
  
  <!-- Easels, Brushes, Palette Artistic Composition -->
  <g transform="translate(180, 70)">
    <!-- Palette base -->
    <path d="M120 40 C60 40 20 80 20 140 C20 200 70 240 120 240 C140 240 150 225 150 210 C150 195 135 185 135 170 C135 150 155 130 180 130 L200 130 C230 130 250 100 250 70 C250 35 190 40 120 40 Z" fill="#FDFBF7" opacity="0.95"/>
    <!-- Palette pigments -->
    <circle cx="70" cy="90" r="15" fill="#AE2012"/>
    <circle cx="110" cy="70" r="15" fill="#EE9B00"/>
    <circle cx="160" cy="80" r="15" fill="#0A9396"/>
    <circle cx="65" cy="145" r="15" fill="#3D0C11"/>
    <circle cx="95" cy="190" r="15" fill="#CA6702"/>
    <!-- Paintbrushes crossed -->
    <line x1="20" y1="250" x2="220" y2="20" stroke="#3D0C11" stroke-width="10" stroke-linecap="round"/>
    <line x1="210" y1="30" x2="225" y2="15" stroke="#CA6702" stroke-width="12" stroke-linecap="round"/>
    <line x1="220" y1="250" x2="20" y2="20" stroke="#001219" stroke-width="8" stroke-linecap="round"/>
    <line x1="30" y1="30" x2="15" y2="15" stroke="#0A9396" stroke-width="10" stroke-linecap="round"/>
  </g>
  <!-- Dynamic Splashes -->
  <circle cx="120" cy="90" r="22" fill="#FDFBF7" opacity="0.85"/>
  <circle cx="480" cy="280" r="18" fill="#FDE047" opacity="0.9"/>
  <circle cx="510" cy="110" r="14" fill="#0A9396" opacity="0.8"/>
  <circle cx="90" cy="310" r="25" fill="#721B24" opacity="0.6"/>
</svg>