<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="acBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#001219"/>
      <stop offset="40%" stop-color="#005F73"/>
      <stop offset="80%" stop-color="#0A9396"/>
      <stop offset="100%" stop-color="#94D2BD"/>
