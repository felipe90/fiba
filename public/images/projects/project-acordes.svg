  </defs>
  <rect width="600" height="400" fill="url(#acBg)"/>
  
  <!-- Flowing Symphony Waves & Staff Lines -->
  <g opacity="0.75">
    <path d="M -50 200 Q 100 120, 250 180 T 550 100 T 650 160" fill="none" stroke="#FDFBF7" stroke-width="2"/>
    <path d="M -50 220 Q 100 140, 250 200 T 550 120 T 650 180" fill="none" stroke="#FDFBF7" stroke-width="2"/>
    <path d="M -50 240 Q 100 160, 250 220 T 550 140 T 650 200" fill="none" stroke="#FDFBF7" stroke-width="2"/>
    <path d="M -50 260 Q 100 180, 250 240 T 550 160 T 650 220" fill="none" stroke="#FDFBF7" stroke-width="2"/>
    <path d="M -50 280 Q 100 200, 250 260 T 550 180 T 650 240" fill="none" stroke="#FDFBF7" stroke-width="2"/>
  </g>

  <!-- Classical Violin & Cello Silhouette Silhouette in Gold -->
  <g transform="translate(240, 60)">
    <!-- Violin body -->
    <path d="M60 20 C90 20 110 50 110 80 C110 105 95 120 85 130 C105 145 125 175 125 215 C125 265 85 295 60 295 C35 295 -5 265 -5 215 C-5 175 15 145 35 130 C25 120 10 105 10 80 C10 50 30 20 60 20 Z" fill="#EE9B00" opacity="0.95"/>
    <path d="M60 30 C80 30 95 55 95 80 C95 100 85 110 75 120 C90 135 105 160 105 200 C105 240 75 270 60 270 C45 270 15 240 15 200 C15 160 30 135 45 120 C35 110 25 100 25 80 C25 55 40 30 60 30 Z" fill="#721B24" opacity="0.85"/>
    <!-- F-holes -->
    <path d="M40 140 C45 155 35 175 40 190" stroke="#FDFBF7" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M80 140 C75 155 85 175 80 190" stroke="#FDFBF7" stroke-width="4" stroke-linecap="round" fill="none"/>
  </g>
  
  <!-- Musical Notes floating -->
  <circle cx="120" cy="140" r="14" fill="#FDE047"/>
  <line x1="134" y1="140" x2="134" y2="80" stroke="#FDE047" stroke-width="4"/>
  <circle cx="170" cy="120" r="14" fill="#FDE047"/>
  <line x1="184" y1="120" x2="184" y2="60" stroke="#FDE047" stroke-width="4"/>
  <line x1="134" y1="80" x2="184" y2="60" stroke="#FDE047" stroke-width="7"/>
  
  <circle cx="480" cy="240" r="16" fill="#FDFBF7" opacity="0.9"/>
  <circle cx="530" cy="180" r="12" fill="#EE9B00" opacity="0.9"/>
